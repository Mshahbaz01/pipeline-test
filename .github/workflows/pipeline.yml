name: CI-CD Pipeline

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/mshahbaz01/pipeline-test

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

      - name: Security scan (filesystem)
        run: |
          docker run --rm -v ${{ github.workspace }}:/src aquasec/trivy:latest fs --severity CRITICAL,HIGH --exit-code 1 /src

  image:
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Push image
        run: docker push $IMAGE_NAME:latest

  deploy:
    needs: image
    runs-on: self-hosted
    steps:
      - name: Pull and run image
        shell: cmd
        run: |
          docker rm -f demo 2>nul
          docker pull ghcr.io/mshahbaz01/pipeline-test:latest
          docker run -d -p 3000:3000 --name demo ghcr.io/mshahbaz01/pipeline-test:latest